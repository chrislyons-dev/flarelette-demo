name = "content-service"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "content-db"
database_id = "placeholder-will-be-created"

# Environment variables
[vars]
JWT_ISS = "https://gateway.internal"
JWT_AUD = "flarelette.mesh"

# HS512 shared secret (set via wrangler secret put JWT_SECRET)
# For local dev, use .dev.vars file
