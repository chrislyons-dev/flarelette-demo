name = "image-service"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# R2 bucket binding
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "images"

# Environment variables
[vars]
JWT_ISS = "https://gateway.internal"
JWT_AUD = "flarelette.mesh"

# HS512 shared secret (set via wrangler secret put JWT_SECRET)
# For local dev, use .dev.vars file
