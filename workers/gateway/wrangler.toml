name = "gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Service bindings to microservices
[[services]]
binding = "CONTENT_SERVICE"
service = "content-service"

[[services]]
binding = "IMAGE_SERVICE"
service = "image-service"

[[services]]
binding = "FORMS_SERVICE"
service = "forms-service"

# Environment variables
[vars]
JWT_ISS = "https://gateway.internal"
JWT_AUD = "flarelette.mesh"
JWT_TTL_SECONDS = "900"

# HS512 shared secret (set via wrangler secret put JWT_SECRET)
# For local dev, use .dev.vars file

# Local dev: Set USE_HTTP_SERVICES="true" in .dev.vars to use HTTP instead of service bindings
# Production: Leave unset to use service bindings

# Auth0 configuration (placeholders - configure in production)
AUTH0_DOMAIN = "your-tenant.auth0.com"
AUTH0_AUDIENCE = "https://your-api.example.com"

# Routes (configure with your custom domain)
# Uncomment and modify when deploying to production
# [[routes]]
# pattern = "yourdomain.com/api/*"
# zone_name = "yourdomain.com"
