name = "flarelette-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = false

# Service bindings to microservices
[[services]]
binding = "CONTENT_SERVICE"
service = "flarelette-content-service"

[[services]]
binding = "IMAGE_SERVICE"
service = "flarelette-image-service"

[[services]]
binding = "FORMS_SERVICE"
service = "flarelette-forms-service"

# Environment variables
[vars]
JWT_ISS = "https://gateway.internal"
JWT_AUD = "flarelette.mesh"
JWT_TTL_SECONDS = "900"
JWKS_KID = "v1"

# Auth0 configuration (placeholders - configure in production)
AUTH0_DOMAIN = "your-tenant.auth0.com"
AUTH0_AUDIENCE = "https://your-api.example.com"

# Routes (configure with your custom domain)
# Uncomment and modify when deploying to production
# [[routes]]
# pattern = "yourdomain.com/api/*"
# zone_name = "yourdomain.com"
