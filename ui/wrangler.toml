# Flarelette Demo UI - Cloudflare Pages Configuration
#
# Static site built with Astro + React, deployed to Cloudflare Pages.
# Provides user interface for content, forms, & image services with Auth0 authentication.
# 
# @uses gateway invoke gateway /api endpoints
#

name = "flarelette-demo-ui"
compatibility_date = "2025-10-10"

services = [{ service = "gateway", binding = "GATEWAY" }]
# Production environment configuration
[env.production.vars]
PUBLIC_API_BASE_URL = "https://flarelette.chrislyons.dev"
PUBLIC_SITE_URL = "https://flarelette.chrislyons.dev"

# Preview environment (branch deployments)
[env.preview.vars]
PUBLIC_API_BASE_URL = "https://preview.flarelette.chrislyons.dev"
PUBLIC_SITE_URL = "https://preview.flarelette.chrislyons.dev"

# Development environment (local dev server)
[env.development.vars]
PUBLIC_API_BASE_URL = "http://localhost:8787"
PUBLIC_SITE_URL = "http://localhost:4321"

# Build configuration
# Note: Build happens via 'astro build' before deployment
# Output: static files in dist/ directory
# Deployment: via 'wrangler pages deploy dist' or GitHub Actions
